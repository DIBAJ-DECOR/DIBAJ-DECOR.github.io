<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ديباج - ستائر فاخرة جدة</title>
<style>
body{margin:0;font-family:system-ui;background:#f8f9fa;color:#0a1931}
.header{background:#0a1931;color:#d4af37;padding:20px;text-align:center;font-size:28px;font-weight:bold}
.hero{background:linear-gradient(135deg,#0a1931,#1a3a5f);color:white;padding:40px 20px;text-align:center}
.hero h1{color:#d4af37;margin:0;font-size:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;padding:20px;max-width:1200px;margin:auto}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.card img{width:100%;height:240px;object-fit:cover}
.info{padding:15px}
.badge{background:#d4af37;color:#0a1931;padding:4px 10px;border-radius:20px;font-size:12px}
.footer{background:#0a1931;color:white;text-align:center;padding:25px;margin-top:30px}
</style>
</head>
<body>
<div class="header">DIBAJ - ديباج للستائر</div>
<div class="hero">
<h1>ستائر فاخرة - طاولات فاضية بدون ورود ✓</h1>
<p>جدة | صن سكرين + بلاك أوت</p>
</div>
<div class="grid">
<div class="card">
<img src="https://images.unsplash.com/photo-1615873968403-89e068629265?w=600">
<div class="info"><h3>صن سكرين مسبح - بدون ورود</h3><p>طاولة خشب فاضية تماما</p><span class="badge">بدون ورود ✓</span></div>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1497366811353-2533774fa7f4?w=600">
<div class="info"><h3>بلاك أوت مكتب - بدون ورود</h3><p>5 شبابيك تعتيم كامل</p><span class="badge">بدون ورود ✓</span></div>
</div>
</div>
<div class="footer">ديباج - جدة - 2026</div>
</body>
</html>
