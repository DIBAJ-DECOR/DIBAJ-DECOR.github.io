<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ديباج للديكور - التقييمات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1931;color:#fdfbf7;font-family:'Tajawal',sans-serif;min-height:100vh;line-height:1.7}
.home-btn-fixed{position:fixed;top:18px;left:18px;z-index:9999;background:#f5e6c8;color:#0a1931;padding:10px 22px;border-radius:999px;text-decoration:none;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 18px rgba(0,0,0,0.35);border:1px solid rgba(10,25,49,0.1);transition:all .2s ease}
.home-btn-fixed:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,0.4);background:#fff2d6}
.logo-wrap{padding-top:92px;text-align:center}
.logo-wrap img{width:120px;height:auto;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.3));background:rgba(255,255,255,0.04);border-radius:18px;padding:10px}
.logo-wrap h1{margin-top:18px;font-size:28px;font-weight:800;letter-spacing:-0.02em}
.logo-wrap p{opacity:.75;font-size:14px;margin-top:6px}
.container{max-width:760px;margin:32px auto;padding:0 20px 60px}
.card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(12px);border-radius:20px;padding:24px;margin-bottom:22px}
.card h2{font-size:18px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.card h2 span.num{background:#f5e6c8;color:#0a1931;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.criteria{display:grid;gap:18px}
.criterion{display:flex;flex-direction:column;gap:8px;padding:16px;background:rgba(255,255,255,0.04);border-radius:14px;border:1px solid rgba(255,255,255,0.06)}
.criterion-label{font-weight:700;font-size:15px}
.stars{display:flex;gap:6px;flex-direction:row-reverse;justify-content:flex-end}
.stars button{background:none;border:none;font-size:26px;cursor:pointer;color:rgba(255,255,255,0.25);transition:all .15s}
.stars button.active,.stars button:hover{color:#ffcb45;transform:scale(1.15)}
.input,textarea,select{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:12px 14px;color:#fff;font-family:'Tajawal';font-size:15px;outline:none}
.input:focus,textarea:focus{border-color:#f5e6c8;background:rgba(255,255,255,0.1)}
.upload-area{border:2px dashed rgba(245,230,200,0.3);border-radius:14px;padding:18px;text-align:center;cursor:pointer;transition:.2s}
.upload-area:hover{border-color:#f5e6c8;background:rgba(245,230,200,0.06)}
.upload-area input{display:none}
.btn-main{width:100%;background:#f5e6c8;color:#0a1931;border:none;border-radius:14px;padding:14px;font-family:'Tajawal';font-weight:800;font-size:16px;cursor:pointer;transition:.2s;margin-top:10px}
.btn-main:hover{background:#fff2d6;transform:translateY(-1px)}
.reviews{display:grid;gap:14px;margin-top:10px}
.review-item{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px}
.review-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.review-stars{color:#ffcb45}
.review-img{width:100%;max-height:240px;object-fit:cover;border-radius:10px;margin-top:10px}
.whatsapp-fab{position:fixed;bottom:22px;right:22px;z-index:999;background:#25D366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:28px;box-shadow:0 8px 24px rgba(0,0,0,0.35)}
.avg-box{display:flex;gap:12px;align-items:center;background:rgba(245,230,200,0.1);border-radius:14px;padding:14px 18px}
.avg-num{font-size:36px;font-weight:800;color:#f5e6c8}
</style>
</head>
<body>
<a href="https://dibajdecor.com" class="home-btn-fixed" aria-label="العودة للرئيسية">🏠 العودة للرئيسية</a>
<a href="https://wa.me/966557755026" class="whatsapp-fab" aria-label="واتساب">💬</a>

<div class="logo-wrap">
  <img src="logo.png" onerror="this.src='https://dibajdecor.com/logo.png'" alt="ديباج للديكور" width="120" height="120">
  <h1>ديباج للديكور</h1>
  <p>آراء عملائنا هي مصدر فخرنا - تقييم شفاف وموثوق</p>
</div>

<div class="container">
  <div class="card">
    <div class="avg-box">
      <div class="avg-num" id="avgNum">0.0</div>
      <div>
        <div style="color:#ffcb45;font-size:18px" id="avgStars">☆☆☆☆☆</div>
        <div style="font-size:13px;opacity:.7"><span id="totalCount">0</span> تقييم</div>
      </div>
      <div style="margin-right:auto;font-size:13px;opacity:.6">الواتساب: 966557755026</div>
    </div>
  </div>

  <div class="card">
    <h2><span class="num">✦</span> أضف تقييمك</h2>
    <div style="display:grid;gap:14px">
      <input id="clientName" class="input" placeholder="اسمك الكريم">
      <input id="clientPhone" class="input" placeholder="رقم الجوال (اختياري)">
      <textarea id="comment" rows="3" placeholder="اكتب تجربتك مع ديباج..."></textarea>
      
      <div class="criteria" id="criteriaBox">
        <!-- سيتم توليد 6 معايير -->
      </div>

      <label class="upload-area" for="imgInput">
        <input type="file" id="imgInput" accept="image/*">
        <div>📷 <span style="font-weight:700">ارفع صورة العمل (اختياري)</span></div>
        <div style="font-size:12px;opacity:.6;margin-top:4px">JPG, PNG حتى 2MB</div>
        <img id="previewImg" style="display:none;margin:12px auto 0;max-width:100%;border-radius:10px;max-height:180px">
      </label>

      <button class="btn-main" onclick="submitReview()">نشر التقييم ⭐</button>
      <div id="msg" style="text-align:center;font-size:13px;min-height:18px"></div>
    </div>
  </div>

  <div class="card">
    <h2><span class="num">★</span> أحدث التقييمات</h2>
    <div class="reviews" id="reviewsList"></div>
  </div>
</div>

<script>
const CRITERIA = [
  "جودة المنتج",
  "السرعة في معاينة الموقع واخذ المقاسات",
  "الالتزام بالمواعيد",
  "جودة التركيب والنظافة",
  "خدمة ما بعد البيع",
  "اخرى"
];
const STORAGE_KEY = "dibaj_reviews_FINAL_6";
let ratings = [0,0,0,0,0,0];
let uploadedBase64 = "";

function renderCriteria(){
  const box = document.getElementById('criteriaBox');
  box.innerHTML = CRITERIA.map((c,i) => `
    <div class="criterion">
      <div class="criterion-label">${i+1}. ${c}</div>
      <div class="stars" data-index="${i}">
        ${[5,4,3,2,1].map(s => `<button onclick="setRate(${i},${s})" data-star="${s}" data-c="${i}">★</button>`).join('')}
      </div>
    </div>
  `).join('');
}
function setRate(ci, val){
  ratings[ci]=val;
  document.querySelectorAll(`.stars[data-index="${ci}"] button`).forEach(b=>{
    b.classList.toggle('active', parseInt(b.dataset.star) <= val);
  });
}

document.getElementById('imgInput').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    uploadedBase64 = ev.target.result;
    const img=document.getElementById('previewImg');
    img.src=uploadedBase64;
    img.style.display='block';
  };
  reader.readAsDataURL(file);
});

function loadReviews(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"); }catch{ return [] }
}
function saveReviews(arr){ localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }

function calcAvg(rev){
  if(!rev.ratings) return 0;
  const sum = rev.ratings.reduce((a,b)=>a+b,0);
  return sum / rev.ratings.length;
}
function renderReviews(){
  const list = loadReviews();
  const container = document.getElementById('reviewsList');
  const avgAll = list.length ? (list.reduce((a,r)=>a+calcAvg(r),0)/list.length) : 0;
  document.getElementById('avgNum').textContent = avgAll.toFixed(1);
  document.getElementById('totalCount').textContent = list.length;
  document.getElementById('avgStars').textContent = "★★★★★".slice(0, Math.round(avgAll)) + "☆☆☆☆☆".slice(0, 5-Math.round(avgAll));

  if(!list.length){
    container.innerHTML = '<div style="text-align:center;opacity:.5;padding:20px">لا توجد تقييمات بعد - كن أول من يقيّم</div>';
    return;
  }
  container.innerHTML = list.map(r=>{
    const avg = calcAvg(r).toFixed(1);
    const stars = "★".repeat(Math.round(avg)) + "☆".repeat(5-Math.round(avg));
    return `<div class="review-item">
      <div class="review-head"><strong>${r.name||'عميل'}</strong><span class="review-stars">${stars} ${avg}</span></div>
      <div style="font-size:13px;opacity:.7;margin-bottom:6px">${CRITERIA.map((c,i)=>`${c}: ${r.ratings[i]||0}★`).join(' • ')}</div>
      <div style="font-size:14px">${r.comment||''}</div>
      ${r.image? `<img src="${r.image}" class="review-img">` : ''}
      <div style="font-size:11px;opacity:.5;margin-top:8px">${r.date||''}</div>
    </div>`
  }).join('');
}

function submitReview(){
  const name = document.getElementById('clientName').value.trim();
  const comment = document.getElementById('comment').value.trim();
  if(ratings.some(v=>v===0)){
    document.getElementById('msg').textContent = "الرجاء تقييم جميع المعايير الستة";
    document.getElementById('msg').style.color="#ffb4a8";
    return;
  }
  if(!comment){ document.getElementById('msg').textContent="الرجاء كتابة تعليق"; return; }
  const reviews = loadReviews();
  reviews.unshift({
    name: name || "عميل ديباج",
    phone: document.getElementById('clientPhone').value.trim(),
    comment,
    ratings: [...ratings],
    image: uploadedBase64,
    date: new Date().toLocaleDateString('ar-SA')
  });
  saveReviews(reviews);
  document.getElementById('msg').textContent="تم نشر تقييمك بنجاح - شكراً لك ✨";
  document.getElementById('msg').style.color="#b6f7b0";
  ratings=[0,0,0,0,0,0];
  uploadedBase64="";
  document.getElementById('clientName').value="";
  document.getElementById('comment').value="";
  document.getElementById('previewImg').style.display='none';
  renderCriteria();
  renderReviews();
}

renderCriteria();
renderReviews();
</script>
</body>
</html>
