<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ديباج للديكور - التقييمات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js","firebase/storage":"https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js"}}</script>
<style>
:root{--bg:#0a1931;--text:#fdfbf7;--gold:#f5e6c8;--gold2:#d4af37;}
*{box-sizing:border-box}body{background:#0a1931;color:#fdfbf7;font-family:'Tajawal',sans-serif;min-height:100vh;line-height:1.7;margin:0;padding:0 16px 60px}
.home-btn-fixed{position:fixed;top:18px;left:18px;z-index:9999;background:#f5e6c8;color:#0a1931;padding:10px 22px;border-radius:999px;text-decoration:none;font-weight:800}
.container{max-width:920px;margin:0 auto;padding-top:76px}.logo-wrap{text-align:center;padding:18px 0 6px}
.main-title{font-size:42px;font-weight:900;text-align:center;margin:8px 0 6px;color:#f5e6c8}
.sub-title{text-align:center;opacity:.75;margin:0 0 28px;font-size:17px}
.criteria-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:22px 0 30px}
.criteria-box{background:rgba(245,230,200,.07);border:1px solid rgba(245,230,200,.16);border-radius:18px;padding:18px 14px;text-align:center}
.criteria-box h3{margin:0 0 12px;font-size:17px;font-weight:800;color:#f5e6c8}
.stars{display:flex;justify-content:center;gap:6px;direction:ltr}.star{font-size:30px;cursor:pointer;color:#23365c;transition:.2s}.star.active{color:#d4af37;transform:scale(1.15)}
.form-card{background:#fdfbf7;color:#0a1931;border-radius:24px;padding:26px;margin-bottom:40px}
.form-card h2{margin:0 0 18px;font-size:22px;font-weight:800;text-align:center}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label.form-label{display:block;font-weight:700;font-size:14px;margin:10px 2px 6px;color:#0a1931}
.input{width:100%;padding:12px 14px;border:1.6px solid #e8ddd0;border-radius:12px;font-family:'Tajawal';font-size:15px}
.file-label{display:block;background:#0a1931;color:#f5e6c8;padding:12px;border-radius:12px;text-align:center;cursor:pointer;font-weight:800}
.preview-img{width:100%;max-height:240px;object-fit:cover;border-radius:14px;margin-top:12px;display:none}
.submit-btn{width:100%;background:#0a1931;color:#f5e6c8;border:none;padding:14px;border-radius:999px;font-family:'Tajawal';font-weight:800;font-size:17px;cursor:pointer;margin-top:18px}
.whatsapp-btn{width:100%;background:#25D366;color:#fff;border:none;padding:13px;border-radius:999px;font-family:'Tajawal';font-weight:800;font-size:16px;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.reviews-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.reviews-title{font-size:28px;font-weight:800;color:#f5e6c8}.reviews-count{background:rgba(245,230,200,.12);border:1px solid rgba(245,230,200,.18);color:#f5e6c8;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px}
.review-card{background:rgba(253,251,247,.06);border:1px solid rgba(253,251,247,.11);border-radius:20px;padding:18px;margin-bottom:14px}
.review-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.review-name{font-weight:800;color:#f5e6c8}.review-meta{font-size:12px;opacity:.62}
.review-service{display:inline-block;background:rgba(212,175,55,.18);border:1px solid rgba(212,175,55,.28);color:#f5e6c8;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;margin-bottom:8px}
.review-stars{color:#d4af37;margin-bottom:8px;font-size:14px;display:flex;gap:10px;flex-wrap:wrap}.review-stars b{color:#f5e6c8;font-size:12px;background:rgba(245,230,200,.1);padding:2px 8px;border-radius:999px}
.review-comment{opacity:.92;line-height:1.85;font-size:15px;white-space:pre-wrap}.review-img{width:100%;border-radius:14px;margin-top:12px;max-height:340px;object-fit:cover}
.mini-btn{background:rgba(245,230,200,.12);border:1px solid rgba(245,230,200,.18);color:#f5e6c8;padding:6px 12px;border-radius:999px;font-family:'Tajawal';font-weight:700;font-size:12px;cursor:pointer}
.empty{text-align:center;opacity:.6;padding:36px 10px;border:1px dashed rgba(245,230,200,.18);border-radius:18px;margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f5e6c8;color:#0a1931;padding:12px 18px;border-radius:999px;font-weight:800;z-index:10000;display:none}.toast.show{display:block}
</style></head><body>
<a href="/index.html" class="home-btn-fixed">🏠 الرئيسية</a>
<div class="container">
<div class="logo-wrap"><img src="logo.png" alt="ديباج" style="width:130px;display:block;margin:0 auto"></div>
<h1 class="main-title">تقييمات عملائنا</h1><p class="sub-title">رأيكم يهمنا - قيّموا تجربتكم مع ديباج للديكور</p>
<div class="criteria-grid" id="criteriaGrid"></div>
<div class="form-card"><h2>أضف تقييمك الآن ⭐</h2>
<label class="form-label">الاسم الكريم *</label><input id="cName" class="input" placeholder="مثال: أحمد محمد" />
<div class="form-row"><div><label class="form-label">رقم الجوال</label><input id="cPhone" class="input" placeholder="05xxxxxxxx" /></div>
<div><label class="form-label">نوع الخدمة *</label><select id="cService" class="input"><option value="">اختر الخدمة</option><option>جودة المنتج</option><option>السرعة في معاينة الموقع واخذ المقاسات</option><option>الالتزام بالمواعيد</option><option>جودة التركيب والنظافة</option><option>خدمة ما بعد البيع</option><option>اخرى</option></select></div></div>
<label class="form-label">تعليقك</label><textarea id="cComment" class="input" placeholder="احكِ لنا عن تجربتك..."></textarea>
<div class="file-wrap"><label class="form-label">صورة (اختياري)</label><label class="file-label" for="cImage">📸 اختر صورة</label><input type="file" id="cImage" accept="image/*" style="display:none"><img id="imgPreview" class="preview-img" /></div>
<button id="submitBtn" class="submit-btn">إرسال التقييم ✨</button>
<a class="whatsapp-btn" href="https://wa.me/966557755026" target="_blank">💬 تواصل عبر واتساب - 966557755026</a></div>
<div class="reviews-head"><h2 class="reviews-title">آراء العملاء</h2><span id="reviewsCount" class="reviews-count">...</span></div><div id="reviewsList"></div></div>
<div id="toast" class="toast"></div>
<script type="module">
import { initializeApp } from "firebase/app";import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc } from "firebase/firestore";import { getStorage, ref, uploadBytes, getDownloadURL } from "firebase/storage";
const firebaseConfig = { apiKey: "AIzaSyBqRdVHpGMStLO8qDFq55B-9nw9ydT74gc", authDomain: "dibaj-94ed5.firebaseapp.com", projectId: "dibaj-94ed5", storageBucket: "dibaj-94ed5.firebasestorage.app", messagingSenderId: "465317569395", appId: "1:465317569395:web:faded71f98ebd896fa9b06" };
const app = initializeApp(firebaseConfig);const db = getFirestore(app);const storage = getStorage(app);const reviewsCol = collection(db, "reviews");
const OWNER_WHATSAPP = "966557755026";
const CRITERIA=[{id:'quality',label:'جودة المنتج'},{id:'speed',label:'السرعة في معاينة الموقع'},{id:'punctual',label:'الالتزام بالمواعيد'},{id:'install',label:'جودة التركيب والنظافة'},{id:'after',label:'خدمة ما بعد البيع'},{id:'other',label:'اخرى'}];let ratings={quality:0,speed:0,punctual:0,install:0,after:0,other:0};let uploadedFile=null;let allReviews=[];
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function renderCriteria(){const g=document.getElementById('criteriaGrid');g.innerHTML=CRITERIA.map(c=>`<div class="criteria-box"><h3>${c.label}</h3><div class="stars" data-c="${c.id}">${[1,2,3,4,5].map(n=>`<span class="star" data-val="${n}" data-c="${c.id}">★</span>`).join('')}</div></div>`).join('');g.querySelectorAll('.star').forEach(s=>{s.onclick=function(){const c=this.dataset.c;const v=parseInt(this.dataset.val);ratings[c]=v;g.querySelectorAll(`.stars[data-c="${c}"] .star`).forEach(x=>{x.classList.toggle('active',parseInt(x.dataset.val)<=v)})}})}
function esc(s){return s?s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])):''}
function fmt(ts){try{const d=ts?.toDate?ts.toDate():new Date();return d.toLocaleDateString('ar-EG')}catch{return''}}
const q=query(reviewsCol,orderBy('createdAt','desc'));onSnapshot(q,(snap)=>{allReviews=[];snap.forEach(d=>{allReviews.push({id:d.id,...d.data()})});render()});
function render(){const c=document.getElementById('reviewsList');const co=document.getElementById('reviewsCount');co.textContent=allReviews.length+' تقييم';if(!allReviews.length){c.innerHTML='<div class="empty">لا توجد تقييمات بعد - كن أول من يقيّم ✨</div>';return}c.innerHTML=allReviews.map(r=>{const st=Object.entries(r.ratings||{}).map(([k,v])=>{const lb=(CRITERIA.find(x=>x.id===k)||{}).label||k;return `<b>${lb}: ${'★'.repeat(v)}</b>`}).join(' ');return `<div class="review-card"><div class="review-head"><span class="review-name">${esc(r.name)}</span><span class="review-meta">${fmt(r.createdAt)} • ⭐ ${r.avg}</span></div><span class="review-service">${esc(r.service)}</span><div class="review-stars">${st}</div><div class="review-comment">${esc(r.comment)}</div>${r.imageUrl?`<img src="${r.imageUrl}" class="review-img" />`:''}<div style="margin-top:10px"><button class="mini-btn" onclick="window.del('${r.id}')">حذف</button></div></div>`}).join('')}
window.del=async(id)=>{if(!confirm('حذف؟'))return;await deleteDoc(doc(db,"reviews",id));showToast('تم الحذف')}
document.getElementById('cImage').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;uploadedFile=f;const r=new FileReader();r.onload=ev=>{const p=document.getElementById('imgPreview');p.src=ev.target.result;p.style.display='block'};r.readAsDataURL(f)});
document.getElementById('submitBtn').onclick=async function(){
const name=document.getElementById('cName').value.trim();
const service=document.getElementById('cService').value;
const comment=document.getElementById('cComment').value.trim();
const phone=document.getElementById('cPhone').value.trim();
if(!name){showToast('ادخل الاسم');return}
if(!service){showToast('اختر الخدمة');return}
if(!Object.values(ratings).some(v=>v>0)){showToast('قيم نجمة واحدة على الأقل');return}
const avg=Object.values(ratings).filter(v=>v>0).reduce((a,b)=>a+b,0)/(Object.values(ratings).filter(v=>v>0).length||1);
const finalAvg = parseFloat(avg.toFixed(1));
const txt = encodeURIComponent('🔔 تقييم جديد - ديباج\n\n👤 '+name+'\n📱 '+phone+'\n🛠 '+service+'\n⭐ '+finalAvg+'\n💬 '+comment);
const waUrl = 'https://wa.me/'+OWNER_WHATSAPP+'?text='+txt;
const a=document.createElement('a');
a.href=waUrl;
a.target='_blank';
a.rel='noopener';
document.body.appendChild(a);
a.click();
a.remove();
this.disabled=true;this.textContent='جاري...';
try{
let imageUrl='';
if(uploadedFile){const sref=ref(storage,'reviews/'+Date.now()+'_'+uploadedFile.name);await uploadBytes(sref,uploadedFile);imageUrl=await getDownloadURL(sref)}
await addDoc(reviewsCol,{name,phone,service,comment,ratings:{...ratings},avg:finalAvg,imageUrl,createdAt:serverTimestamp()});
document.getElementById('cName').value='';document.getElementById('cService').value='';document.getElementById('cComment').value='';document.getElementById('cPhone').value='';uploadedFile=null;document.getElementById('imgPreview').style.display='none';ratings={quality:0,speed:0,punctual:0,install:0,after:0,other:0};renderCriteria();showToast('تم النشر ✨')
}catch(e){showToast('خطأ:'+e.message)}
this.disabled=false;this.textContent='إرسال التقييم ✨'
}
renderCriteria();
</script></body></html>
