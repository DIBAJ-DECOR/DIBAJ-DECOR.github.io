<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ديباج - التقييمات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{background:#0a1931;color:#fdfbf7;font-family:'Tajawal',sans-serif;margin:0;padding:0 16px 60px}
.home-btn-fixed{position:fixed;top:18px;left:18px;z-index:9999;background:#f5e6c8;color:#0a1931;padding:10px 22px;border-radius:999px;text-decoration:none;font-weight:800}
.container{max-width:920px;margin:0 auto;padding-top:76px}.main-title{font-size:36px;font-weight:900;text-align:center;color:#f5e6c8}
.sub-title{text-align:center;opacity:.75;margin:0 0 20px}
.criteria-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:20px 0 30px}
.criteria-box{background:rgba(245,230,200,.07);border:1px solid rgba(245,230,200,.16);border-radius:18px;padding:16px;text-align:center}
.criteria-box h3{margin:0 0 10px;font-size:15px;color:#f5e6c8}
.stars{display:flex;justify-content:center;gap:6px;direction:ltr}.star{font-size:32px;cursor:pointer;color:#23365c}.star.active{color:#d4af37}
.form-card{background:#fdfbf7;color:#0a1931;border-radius:22px;padding:22px;margin-bottom:30px}
.input{width:100%;padding:12px;border:1.5px solid #e8ddd0;border-radius:10px;font-family:'Tajawal';margin-bottom:10px}
.form-label{font-weight:700;font-size:13px;margin:8px 2px 4px;display:block}
.submit-btn{width:100%;background:#0a1931;color:#f5e6c8;border:none;padding:14px;border-radius:999px;font-weight:800;font-size:17px;cursor:pointer;margin-top:12px}
.file-label{display:block;background:#0a1931;color:#f5e6c8;padding:10px;border-radius:10px;text-align:center;cursor:pointer}
.preview-img{width:100%;max-height:220px;border-radius:12px;margin-top:10px;display:none}
.reviews-count{background:rgba(245,230,200,.12);color:#f5e6c8;padding:5px 12px;border-radius:999px;font-size:13px}
.review-card{background:rgba(253,251,247,.06);border:1px solid rgba(253,251,247,.11);border-radius:18px;padding:16px;margin-bottom:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f5e6c8;color:#0a1931;padding:10px 16px;border-radius:999px;font-weight:800;z-index:10000;display:none}.toast.show{display:block}
</style></head><body>
<a href="index.html" class="home-btn-fixed">🏠 الرئيسية</a>
<div class="container">
<h1 class="main-title">تقييمات عملائنا</h1><p class="sub-title">قيّم تجربتك</p>
<div class="criteria-grid" id="criteriaGrid"></div>
<div class="form-card">
<label class="form-label">الاسم *</label><input id="cName" class="input" placeholder="اسمك">
<label class="form-label">رقم الجوال</label><input id="cPhone" class="input" placeholder="05xxxxxxxx">
<label class="form-label">تعليقك</label><textarea id="cComment" class="input" placeholder="رأيك"></textarea>
<label class="file-label" for="cImage">📸 صورة</label><input type="file" id="cImage" accept="image/*" style="display:none"><img id="imgPreview" class="preview-img">
<button id="submitBtn" class="submit-btn">إرسال التقييم ✨</button>
<a href="https://wa.me/966557755026" target="_blank" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#25D366;color:#fff;padding:14px;border-radius:999px;font-weight:800;font-size:16px;text-decoration:none;margin-top:10px">💬 تواصل عبر واتساب - 966557755026</a>
</div>
<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="color:#f5e6c8">آراء العملاء</h3><span id="reviewsCount" class="reviews-count">...</span></div>
<div id="reviewsList"></div></div>
<div id="toast" class="toast"></div>
<script>
// === النجوم - يشتغل بدون انترنت ===
const CRITERIA=[{id:'quality',label:'جودة المنتج'},{id:'speed',label:'سرعة في زيارة الموقع واخذ المقاسات'},{id:'punctual',label:'دقة المواعيد'},{id:'install',label:'التركيب'},{id:'after',label:'ما بعد البيع'},{id:'other',label:'اخرى'}];
let ratings={quality:0,speed:0,punctual:0,install:0,after:0,other:0};
function renderCriteria(){
 const g=document.getElementById('criteriaGrid');
 if(!g)return;
 g.innerHTML=CRITERIA.map(c=>`<div class="criteria-box"><h3>${c.label}</h3><div class="stars" data-c="${c.id}">${[1,2,3,4,5].map(n=>`<span class="star" data-val="${n}" data-c="${c.id}">★</span>`).join('')}</div></div>`).join('');
 g.querySelectorAll('.star').forEach(s=>{
   s.onclick=function(){
     const c=this.dataset.c; const v=parseInt(this.dataset.val); ratings[c]=v;
     g.querySelectorAll(`.stars[data-c="${c}"] .star`).forEach(x=>{x.classList.toggle('active',parseInt(x.dataset.val)<=v)})
   }
 });
}
renderCriteria();
document.addEventListener('DOMContentLoaded',renderCriteria);
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyBqRdVHpGMStLO8qDFq55B-9nw9ydT74gc",authDomain:"dibaj-94ed5.firebaseapp.com",projectId:"dibaj-94ed5",storageBucket:"dibaj-94ed5.firebasestorage.app",messagingSenderId:"465317569395",appId:"1:465317569395:web:faded71f98ebd896fa9b06"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);const storage=getStorage(app);const reviewsCol=collection(db,"reviews");
const OWNER_WHATSAPP="966557755026";
let uploadedFile=null;let allReviews=[];
function esc(s){return s?s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])):''}
function fmt(ts){try{const d=ts?.toDate?ts.toDate():new Date();return d.toLocaleDateString('ar-EG')}catch{return''}}
const q=query(reviewsCol,orderBy('createdAt','desc'));
onSnapshot(q,(snap)=>{allReviews=[];snap.forEach(d=>{allReviews.push({id:d.id,...d.data()})});render()});
function render(){
 const c=document.getElementById('reviewsList');const co=document.getElementById('reviewsCount');
 co.textContent=allReviews.length+' تقييم';
 if(!allReviews.length){c.innerHTML='<div style="text-align:center;opacity:.6;padding:20px;border:1px dashed rgba(245,230,200,.2);border-radius:14px">لا تقييمات بعد</div>';return}
 c.innerHTML=allReviews.map(r=>{const st=Object.entries(r.ratings||{}).map(([k,v])=>{const lb=(CRITERIA.find(x=>x.id===k)||{}).label||k;return `<span style="background:rgba(245,230,200,.1);padding:2px 8px;border-radius:999px;font-size:11px;margin:2px">${lb}:${'★'.repeat(v)}</span>`}).join(' ');
 return `<div class="review-card"><div style="display:flex;justify-content:space-between"><b style="color:#f5e6c8">${esc(r.name)}</b><span style="font-size:11px;opacity:.6">${fmt(r.createdAt)} ⭐${r.avg}</span></div><div style="margin:6px 0;font-size:12px;color:#f5e6c8">${esc(r.service)}</div><div style="display:flex;flex-wrap:wrap;gap:4px;margin:6px 0">${st}</div><div style="opacity:.9">${esc(r.comment)}</div>${r.imageUrl?`<img src="${r.imageUrl}" style="width:100%;border-radius:10px;margin-top:8px">`:''}</div>`}).join('');
}
document.getElementById('cImage').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;uploadedFile=f;const r=new FileReader();r.onload=ev=>{const p=document.getElementById('imgPreview');p.src=ev.target.result;p.style.display='block'};r.readAsDataURL(f)});
document.getElementById('submitBtn').onclick=async function(){
 const name=document.getElementById('cName').value.trim();
 const service='عام';
 const comment=document.getElementById('cComment').value.trim();
 const phone=document.getElementById('cPhone').value.trim();
 if(!name){showToast('ادخل الاسم');return}
 if(!Object.values(ratings).some(v=>v>0)){showToast('قيم نجمة');return}
 const avg=Object.values(ratings).filter(v=>v>0).reduce((a,b)=>a+b,0)/(Object.values(ratings).filter(v=>v>0).length||1);
 const finalAvg=parseFloat(avg.toFixed(1));
 const txt=encodeURIComponent('تقييم جديد\nالاسم:'+name+'\nجوال:'+phone+'\nتقييم:'+finalAvg+'\nتعليق:'+comment);
 const waUrl='https://wa.me/'+OWNER_WHATSAPP+'?text='+txt;
 const a=document.createElement('a');a.href=waUrl;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
 this.disabled=true;this.textContent='جاري...';
 try{
  let imageUrl='';
  if(uploadedFile){const sref=ref(storage,'reviews/'+Date.now()+'_'+uploadedFile.name);await uploadBytes(sref,uploadedFile);imageUrl=await getDownloadURL(sref)}
  await addDoc(reviewsCol,{name,phone,service,comment,ratings:{...ratings},avg:finalAvg,imageUrl,createdAt:serverTimestamp()});
  document.getElementById('cName').value='';document.getElementById('cComment').value='';document.getElementById('cPhone').value='';uploadedFile=null;document.getElementById('imgPreview').style.display='none';ratings={quality:0,speed:0,punctual:0,install:0,after:0,other:0};renderCriteria();showToast('تم ✨')
 }catch(e){showToast('خطأ:'+e.message)}
 this.disabled=false;this.textContent='إرسال التقييم ✨'
}
</script>
<a href="https://wa.me/966557755026" target="_blank" style="position:fixed;bottom:20px;right:20px;background:#25D366;color:white;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.35)">💬</a>
</body></html>
