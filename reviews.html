<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ديباج للديكور - التقييمات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a1931;--text:#fdfbf7;--gold:#f5e6c8;--gold2:#d4af37;}
  *{box-sizing:border-box}
  body{background:#0a1931;color:#fdfbf7;font-family:'Tajawal',sans-serif;min-height:100vh;line-height:1.7;margin:0;padding:0 16px 60px}
  .home-btn-fixed{position:fixed;top:18px;left:18px;z-index:9999;background:#f5e6c8;color:#0a1931;padding:10px 22px;border-radius:999px;text-decoration:none;font-weight:800;box-shadow:0 4px 20px rgba(0,0,0,.35);transition:.2s;display:inline-flex;align-items:center;gap:6px}
  .home-btn-fixed:hover{transform:translateY(-2px);background:#fff}
  .container{max-width:920px;margin:0 auto;padding-top:76px}
  .logo-wrap{text-align:center;padding:18px 0 6px}
  .main-title{font-size:42px;font-weight:900;text-align:center;margin:8px 0 6px;color:#f5e6c8;letter-spacing:-.5px}
  .sub-title{text-align:center;opacity:.75;margin:0 0 28px;font-size:17px}
  .criteria-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:22px 0 30px}
  .criteria-box{background:rgba(245,230,200,.07);border:1px solid rgba(245,230,200,.16);border-radius:18px;padding:18px 14px;text-align:center;backdrop-filter:blur(6px);transition:.2s}
  .criteria-box:hover{border-color:rgba(245,230,200,.28);transform:translateY(-1px)}
  .criteria-box h3{margin:0 0 12px;font-size:17px;font-weight:800;color:#f5e6c8}
  .stars{display:flex;justify-content:center;gap:6px;direction:ltr}
  .star{font-size:30px;cursor:pointer;color:#23365c;transition:.18s;user-select:none;line-height:1}
  .star.active{color:#d4af37;text-shadow:0 0 14px rgba(212,175,55,.65)}
  .star:hover{transform:scale(1.15)}
  .avg-badge{display:inline-block;margin-top:10px;background:#f5e6c8;color:#0a1931;font-weight:800;font-size:13px;padding:3px 10px;border-radius:999px;opacity:0;transition:.2s}
  .avg-badge.show{opacity:1}
  .form-card{background:#fdfbf7;color:#0a1931;border-radius:24px;padding:26px;box-shadow:0 22px 70px rgba(0,0,0,.38);margin-bottom:40px}
  .form-card h2{margin:0 0 18px;font-size:22px;font-weight:800;text-align:center;color:#0a1931}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label.form-label{display:block;font-weight:700;font-size:14px;margin:10px 2px 6px;color:#0a1931}
  .input{width:100%;padding:12px 14px;border:1.6px solid #e8ddd0;border-radius:12px;font-family:'Tajawal',sans-serif;font-size:15px;background:#fff;color:#0a1931;outline:none;transition:.2s}
  .input:focus{border-color:#d4af37;box-shadow:0 0 0 3px rgba(212,175,55,.18)}
  textarea.input{resize:vertical;min-height:96px}
  .file-wrap{margin-top:6px}
  .file-label{display:block;background:#0a1931;color:#f5e6c8;padding:12px;border-radius:12px;text-align:center;cursor:pointer;font-weight:800;transition:.2s}
  .file-label:hover{background:#122a57}
  .preview-img{width:100%;max-height:240px;object-fit:cover;border-radius:14px;margin-top:12px;display:none;border:1px solid #e8ddd0}
  .submit-btn{width:100%;background:#0a1931;color:#f5e6c8;border:none;padding:14px;border-radius:999px;font-family:'Tajawal';font-weight:800;font-size:17px;cursor:pointer;margin-top:18px;transition:.2s;letter-spacing:.2px}
  .submit-btn:hover{background:#12306a;transform:translateY(-1px)}
  .submit-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .whatsapp-btn{width:100%;background:#25D366;color:#fff;border:none;padding:13px;border-radius:999px;font-family:'Tajawal';font-weight:800;font-size:16px;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s;text-decoration:none}
  .whatsapp-btn:hover{background:#1ebe57;transform:translateY(-1px)}
  .reviews-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .reviews-title{font-size:28px;font-weight:800;color:#f5e6c8;margin:0;text-align:center}
  .reviews-count{background:rgba(245,230,200,.12);border:1px solid rgba(245,230,200,.18);color:#f5e6c8;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px}
  .review-card{background:rgba(253,251,247,.06);border:1px solid rgba(253,251,247,.11);border-radius:20px;padding:18px;margin-bottom:14px;animation:fadeIn .4s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .review-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
  .review-name{font-weight:800;color:#f5e6c8;font-size:16px}
  .review-meta{font-size:12px;opacity:.62}
  .review-service{display:inline-block;background:rgba(212,175,55,.18);border:1px solid rgba(212,175,55,.28);color:#f5e6c8;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;margin-bottom:8px}
  .review-stars{color:#d4af37;margin-bottom:8px;letter-spacing:1px;font-size:14px;display:flex;gap:10px;flex-wrap:wrap}
  .review-stars b{color:#f5e6c8;font-size:12px;background:rgba(245,230,200,.1);padding:2px 8px;border-radius:999px;font-weight:700}
  .review-comment{opacity:.92;line-height:1.85;font-size:15px;white-space:pre-wrap}
  .review-img{width:100%;border-radius:14px;margin-top:12px;max-height:340px;object-fit:cover;border:1px solid rgba(253,251,247,.12)}
  .review-actions{display:flex;gap:8px;margin-top:12px}
  .mini-btn{background:rgba(245,230,200,.12);border:1px solid rgba(245,230,200,.18);color:#f5e6c8;padding:6px 12px;border-radius:999px;font-family:'Tajawal';font-weight:700;font-size:12px;cursor:pointer}
  .empty{text-align:center;opacity:.6;padding:36px 10px;border:1px dashed rgba(245,230,200,.18);border-radius:18px;margin-top:8px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f5e6c8;color:#0a1931;padding:12px 18px;border-radius:999px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:10000;display:none}
  .toast.show{display:block;animation:pop .35s ease}
  @keyframes pop{from{transform:translateX(-50%) translateY(10px) scale(.96);opacity:0}to{transform:translateX(-50%) translateY(0) scale(1);opacity:1}}
  @media(max-width:640px){.form-row{grid-template-columns:1fr}.main-title{font-size:32px}.criteria-grid{grid-template-columns:1fr 1fr}.container{padding-top:66px}}
  @media(max-width:400px){.criteria-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<a href="/index.html" class="home-btn-fixed" id="homeBtn" onclick="setTimeout(function(){ if(document.visibilityState!=='hidden'){ /* fallback to main site if index.html not found */ } }, 900);">🏠 الرئيسية</a>
<div class="container">
  <div class="logo-wrap">
    <img src="logo.png" alt="ديباج" style="width:130px;display:block;margin:0 auto">
  </div>
  <h1 class="main-title">تقييمات عملائنا</h1>
  <p class="sub-title">رأيكم يهمنا - قيّموا تجربتكم مع ديباج للديكور بكل شفافية</p>

  <div class="criteria-grid" id="criteriaGrid"></div>

  <div class="form-card">
    <h2>أضف تقييمك الآن ⭐</h2>
    <label class="form-label">الاسم الكريم *</label>
    <input id="cName" class="input" placeholder="مثال: أحمد محمد" />
    <div class="form-row">
      <div>
        <label class="form-label">رقم الجوال (اختياري)</label>
        <input id="cPhone" class="input" placeholder="05xxxxxxxx" />
      </div>
      <div>
        <label class="form-label">نوع الخدمة *</label>
        <select id="cService" class="input">
          <option value="">اختر الخدمة</option>
          <option value="جودة المنتج">جودة المنتج</option>
          <option value="السرعة في معاينة الموقع واخذ المقاسات">السرعة في معاينة الموقع واخذ المقاسات</option>
          <option value="الالتزام بالمواعيد">الالتزام بالمواعيد</option>
          <option value="جودة التركيب والنظافة">جودة التركيب والنظافة</option>
          <option value="خدمة ما بعد البيع">خدمة ما بعد البيع</option>
          <option value="اخرى">اخرى</option>
        </select>
      </div>
    </div>
    <label class="form-label">تعليقك</label>
    <textarea id="cComment" class="input" placeholder="احكِ لنا عن تجربتك مع ديباج..."></textarea>

    <div class="file-wrap">
      <label class="form-label">صورة (اختياري)</label>
      <label class="file-label" for="cImage">📸 اختر صورة من جهازك</label>
      <input type="file" id="cImage" accept="image/*" style="display:none">
      <img id="imgPreview" class="preview-img" alt="معاينة" />
    </div>

    <button id="submitBtn" class="submit-btn">إرسال التقييم ✨</button>
    <a id="waBtn" class="whatsapp-btn" href="https://wa.me/966557755026" target="_blank" rel="noopener">💬 تواصل عبر واتساب - 966557755026</a>
    <div style="text-align:center;margin-top:10px;font-size:12px;opacity:.6">سيتم حفظ تقييمك محلياً وإرسال ملخص للواتساب</div>
  </div>

  <div class="reviews-head">
    <h2 class="reviews-title">آراء العملاء</h2>
    <span id="reviewsCount" class="reviews-count">0 تقييم</span>
  </div>
  <div id="reviewsList"></div>
</div>

<div id="toast" class="toast"></div>

<script>
  const LS_KEY = 'dibaj_reviews_FINAL_6';
  const WA_NUMBER = '966557755026';
  const CRITERIA = [
    { id: 'quality', label: 'جودة المنتج' },
    { id: 'speed', label: 'السرعة في معاينة الموقع واخذ المقاسات' },
    { id: 'punctual', label: 'الالتزام بالمواعيد' },
    { id: 'install', label: 'جودة التركيب والنظافة' },
    { id: 'after', label: 'خدمة ما بعد البيع' },
    { id: 'other', label: 'اخرى' }
  ];
  let ratings = { quality:0, speed:0, punctual:0, install:0, after:0, other:0 };
  let uploadedImageData = '';

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2800);
  }

  function renderCriteria(){
    const grid = document.getElementById('criteriaGrid');
    grid.innerHTML = CRITERIA.map(c => `
      <div class="criteria-box" data-id="${c.id}">
        <h3>${c.label}</h3>
        <div class="stars" data-criteria="${c.id}">
          ${[1,2,3,4,5].map(n=>`<span class="star" data-val="${n}" data-c="${c.id}">★</span>`).join('')}
        </div>
        <span class="avg-badge" id="badge-${c.id}">0 / 5</span>
      </div>
    `).join('');
    
    grid.querySelectorAll('.star').forEach(star=>{
      star.addEventListener('click', function(){
        const c = this.dataset.c;
        const v = parseInt(this.dataset.val);
        ratings[c] = v;
        const boxStars = grid.querySelectorAll(`.stars[data-criteria="${c}"] .star`);
        boxStars.forEach(s=>{
          s.classList.toggle('active', parseInt(s.dataset.val) <= v);
        });
        const badge = document.getElementById('badge-'+c);
        badge.textContent = v + ' / 5';
        badge.classList.add('show');
      });
      star.addEventListener('mouseenter', function(){
        const c = this.dataset.c;
        const v = parseInt(this.dataset.val);
        const boxStars = document.querySelectorAll(`.stars[data-criteria="${c}"] .star`);
        boxStars.forEach(s=>{
          const sv = parseInt(s.dataset.val);
          s.style.color = sv <= v ? '#d4af37' : '#23365c';
        });
      });
    });
    grid.querySelectorAll('.stars').forEach(wrap=>{
      wrap.addEventListener('mouseleave', function(){
        const c = this.dataset.criteria;
        const cur = ratings[c] || 0;
        this.querySelectorAll('.star').forEach(s=>{
          const sv = parseInt(s.dataset.val);
          s.style.color = '';
          s.classList.toggle('active', sv <= cur);
        });
      });
    });
  }

  function loadReviews(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveReviews(list){
    localStorage.setItem(LS_KEY, JSON.stringify(list));
  }

  function formatDate(ts){
    const d = new Date(ts);
    return d.toLocaleDateString('ar-EG', {year:'numeric', month:'short', day:'numeric'}) + ' - ' + d.toLocaleTimeString('ar-EG',{hour:'2-digit', minute:'2-digit'});
  }

  function renderReviews(){
    const list = loadReviews().sort((a,b)=>b.ts-a.ts);
    const container = document.getElementById('reviewsList');
    const countEl = document.getElementById('reviewsCount');
    countEl.textContent = list.length + ' تقييم';
    if(list.length===0){
      container.innerHTML = '<div class="empty">لا توجد تقييمات بعد - كن أول من يقيّم ✨<br><span style="font-size:13px">تقييمك سيظهر هنا ويُحفظ في المتصفح</span></div>';
      return;
    }
    container.innerHTML = list.map(r => {
      const starsHtml = Object.entries(r.ratings || {}).map(([k,v])=>{
        const label = (CRITERIA.find(x=>x.id===k)||{}).label || k;
        return `<b>${label}: ${'★'.repeat(v)}${'☆'.repeat(5-v)} (${v})</b>`;
      }).join(' ');
      const avg = r.avg ? r.avg.toFixed(1) : '-';
      return `
        <div class="review-card">
          <div class="review-head">
            <span class="review-name">${escapeHtml(r.name)}</span>
            <span class="review-meta">${formatDate(r.ts)} • ⭐ ${avg}</span>
          </div>
          ${r.service ? `<span class="review-service">${escapeHtml(r.service)}</span>` : ''}
          <div class="review-stars">${starsHtml}</div>
          ${r.comment ? `<div class="review-comment">${escapeHtml(r.comment)}</div>` : ''}
          ${r.image ? `<img src="${r.image}" class="review-img" loading="lazy" alt="صورة العميل" />` : ''}
          <div class="review-actions">
            <button class="mini-btn" onclick="shareWhatsApp('${r.id}')">مشاركة واتساب</button>
            <button class="mini-btn" onclick="deleteReview('${r.id}')">حذف</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str){
    if(!str) return '';
    return str.replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

  function shareWhatsApp(id){
    const list = loadReviews();
    const r = list.find(x=>x.id===id);
    if(!r) return;
    const txt = `تقييم جديد من ${r.name} - ${r.service || ''}\nالمتوسط: ${r.avg}\n${r.comment || ''}`;
    const url = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(txt)}`;
    window.open(url, '_blank');
  }

  function deleteReview(id){
    if(!confirm('هل تريد حذف هذا التقييم؟')) return;
    let list = loadReviews();
    list = list.filter(x=>x.id!==id);
    saveReviews(list);
    renderReviews();
    showToast('تم حذف التقييم');
  }

  // image upload
  document.getElementById('cImage').addEventListener('change', function(e){
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 3*1024*1024){ showToast('الصورة كبيرة جداً - الحد 3 ميجا'); return; }
    const reader = new FileReader();
    reader.onload = function(ev){
      uploadedImageData = ev.target.result;
      const prev = document.getElementById('imgPreview');
      prev.src = uploadedImageData;
      prev.style.display = 'block';
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('submitBtn').addEventListener('click', function(){
    const name = document.getElementById('cName').value.trim();
    const phone = document.getElementById('cPhone').value.trim();
    const service = document.getElementById('cService').value;
    const comment = document.getElementById('cComment').value.trim();
    if(!name){ showToast('الرجاء إدخال الاسم'); return; }
    if(!service){ showToast('اختر نوع الخدمة'); return; }
    const ratedCount = Object.values(ratings).filter(v=>v>0).length;
    if(ratedCount===0){ showToast('قيّم على الأقل معياراً واحداً بالنجوم'); return; }

    const avg = Object.values(ratings).filter(v=>v>0).reduce((a,b)=>a+b,0) / (ratedCount||1);
    const review = {
      id: 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
      name, phone, service, comment,
      ratings: {...ratings},
      avg: parseFloat(avg.toFixed(1)),
      image: uploadedImageData || '',
      ts: Date.now()
    };
    const list = loadReviews();
    list.push(review);
    saveReviews(list);
    renderReviews();

    // reset form
    document.getElementById('cName').value='';
    document.getElementById('cPhone').value='';
    document.getElementById('cService').value='';
    document.getElementById('cComment').value='';
    uploadedImageData='';
    document.getElementById('imgPreview').style.display='none';
    document.getElementById('cImage').value='';
    ratings = { quality:0, speed:0, punctual:0, install:0, after:0, other:0 };
    renderCriteria();
showToast('شكراً لتقييمك! تم الحفظ بنجاح ✨');
const waText = `مرحبا ديباج 👋 الاسم: ${name} الخدمة: ${service}`;
const waUrl = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(waText)}`;
window.location.href = waUrl;
});

  // fallback for home button - if /index.html fails, go to main domain
  document.getElementById('homeBtn').addEventListener('click', function(e){
    // keep primary href as /index.html
    // but also ensure fallback link https://dibajdecor.com is reachable
    const test = this.getAttribute('href');
    if(!test || test === '#'){
      e.preventDefault();
      window.location.href = 'https://dibajdecor.com';
    }
    // additionally, store fallback url for crawlers
    this.setAttribute('data-fallback', 'https://dibajdecor.com');
  });

  // init
  renderCriteria();
  renderReviews();

  // expose for inline handlers
  window.shareWhatsApp = shareWhatsApp;
  window.deleteReview = deleteReview;
</script>
</body></html>
