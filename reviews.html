<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ديباج للستائر - تقييم الخدمة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1931;--navy2:#12264d;--beige:#e8dcca;--beige-light:#f6f0e3;--gold:#d4b36a;--white:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--beige-light);font-family:'Tajawal',sans-serif;line-height:1.6;min-height:100vh}
.container{max-width:680px;margin:0 auto;padding:28px 20px 40px}
.header{text-align:center;margin-bottom:28px}
.logo-wrap{width:92px;height:92px;margin:0 auto 16px;background:var(--beige);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.35);border:3px solid rgba(232,220,202,.3)}
.logo-wrap img{width:78px;height:78px;border-radius:50%;object-fit:contain}
.brand{font-size:32px;font-weight:900;letter-spacing:.5px;color:var(--beige-light);margin-bottom:4px}
.sub{color:var(--gold);font-size:15px;font-weight:500;opacity:.95}
.card{background:linear-gradient(180deg, var(--navy2) 0%, #0e2142 100%);border:1px solid rgba(232,220,202,.18);border-radius:20px;padding:22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.45);margin-bottom:18px}
.card-title{font-size:18px;font-weight:800;margin-bottom:14px;color:var(--beige-light);display:flex;align-items:center;gap:8px}
.card-title span{width:28px;height:28px;background:var(--beige);color:var(--navy);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:900}
.label{font-size:14px;font-weight:700;color:var(--beige);margin-bottom:8px;display:block}
.input, .textarea{width:100%;background:#0c1d3a;border:1.5px solid rgba(232,220,202,.22);color:var(--beige-light);border-radius:12px;padding:13px 14px;font-family:'Tajawal',sans-serif;font-size:15px;outline:none;transition:.2s}
.input:focus,.textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,179,106,.18)}
.textarea{min-height:96px;resize:vertical}
.criteria-list{display:flex;flex-direction:column;gap:14px}
.criterion{background:rgba(255,255,255,.04);border:1px solid rgba(232,220,202,.12);border-radius:14px;padding:12px 12px 10px}
.criterion-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.criterion-name{font-size:14.5px;font-weight:700;color:var(--beige-light)}
.criterion-value{font-size:12px;font-weight:800;background:var(--beige);color:var(--navy);padding:2px 8px;border-radius:20px;min-width:28px;text-align:center}
.stars{display:flex;gap:6px;direction:ltr}
.star{width:38px;height:38px;border-radius:10px;border:1.5px solid rgba(232,220,202,.2);background:rgba(0,0,0,.2);color:var(--beige);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:.15s;user-select:none}
.star.active{background:var(--beige);color:var(--navy);border-color:var(--beige);transform:translateY(-1px);box-shadow:0 4px 12px rgba(232,220,202,.3)}
.star:hover{border-color:var(--gold)}
.btn{width:100%;border:none;border-radius:14px;padding:15px 18px;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:800;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--beige);color:var(--navy);box-shadow:0 8px 20px rgba(232,220,202,.25)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(232,220,202,.3)}
.btn-primary:active{transform:translateY(0)}
.btn-wa{background:transparent;color:var(--beige-light);border:1.5px solid rgba(232,220,202,.3);margin-top:10px}
.btn-wa:hover{background:rgba(232,220,202,.08)}
.hint{font-size:12.5px;color:rgba(246,240,227,.65);margin-top:10px;text-align:center}
.reviews{margin-top:10px}
.review-item{background:rgba(255,255,255,.05);border:1px solid rgba(232,220,202,.1);border-radius:12px;padding:12px;margin-bottom:10px}
.review-head{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:4px}
.footer{text-align:center;margin-top:28px;font-size:12px;color:rgba(246,240,227,.5)}
@media(min-width:640px){.container{padding:36px 24px 50px}.card{padding:24px 22px}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo-wrap">
      <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDgwIDgwIj48Y2lyY2xlIGN4PSI0MCIgY3k9IjQwIiByPSIzOCIgZmlsbD0iI2U4ZGNjYSIgc3Ryb2tlPSIjMGExOTMxIiBzdHJva2Utd2lkdGg9IjIiLz48dGV4dCB4PSI0MCIgeT0iNDQiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC13ZWlnaHQ9IjkwMCIgZm9udC1zaXplPSIxNiIgZmlsbD0iIzBhMTkzMSI+RElCQUo8L3RleHQ+PC9zdmc+" alt="Dibaj Logo">
    </div>
    <div class="brand">ديباج للستائر</div>
    <div class="sub">قيّم تجربتك معنا - رأيك يهمنا</div>
  </div>

  <div class="card">
    <div class="card-title"><span>1</span> معلومات العميل</div>
    <label class="label">الاسم الكامل</label>
    <input id="custName" class="input" placeholder="مثال: أحمد محمد" />
    <div style="height:12px"></div>
    <label class="label">رقم الجوال</label>
    <input id="custPhone" class="input" placeholder="05xxxxxxxx" inputmode="numeric" />
  </div>

  <div class="card">
    <div class="card-title"><span>2</span> قيّم الخدمة (6 معايير)</div>
    <div id="criteriaContainer" class="criteria-list"></div>
    <div class="hint">اضغط على النجوم من 1 إلى 5 لكل معيار</div>
  </div>

  <div class="card">
    <div class="card-title"><span>3</span> ملاحظات إضافية</div>
    <label class="label">هل هناك شيء تود إضافته؟</label>
    <textarea id="custComment" class="textarea" placeholder="اكتب ملاحظاتك هنا..."></textarea>
    <div style="height:16px"></div>
    <button id="submitBtn" class="btn btn-primary">✦ إرسال التقييم</button>
    <div id="statusMsg" class="hint"></div>
    <button id="waBtn" class="btn btn-wa">💬 تواصل واتساب: 966557755026</button>
    <div class="hint">سيتم حفظ التقييم محلياً وإرساله للإدارة</div>
  </div>

  <div id="reviewsBox" class="card reviews" style="display:none">
    <div class="card-title"><span>★</span> تقييمات محفوظة</div>
    <div id="reviewsList"></div>
  </div>

  <div class="footer">© ديباج للستائر - جميع الحقوق محفوظة 2025</div>
</div>

<script>
const POST_URL = "https://script.google.com/macros/s/AKfycbzxamplePOST_URL_FOR_DIBAJ/exec";
const STORAGE_KEY = "dibaj_reviews_FINAL_6";
const WHATSAPP_NUMBER = "966557755026";

const CRITERIA = [
  "جودة المنتج",
  "السرعة في معاينة الموقع واخذ المقاسات",
  "الالتزام بالمواعيد",
  "جودة التركيب والنظافة",
  "خدمة ما بعد البيع",
  "اخرى"
];

let ratings = {};
CRITERIA.forEach(c => ratings[c] = 0);

const container = document.getElementById('criteriaContainer');
function renderCriteria(){
  container.innerHTML = "";
  CRITERIA.forEach(name => {
    const div = document.createElement('div');
    div.className = 'criterion';
    div.innerHTML = `
      <div class="criterion-head">
        <div class="criterion-name">${name}</div>
        <div class="criterion-value">${ratings[name] ? ratings[name] + ' / 5' : 'لم يتم'}</div>
      </div>
      <div class="stars" data-criterion="${name}">
        ${[1,2,3,4,5].map(n => `<div class="star ${ratings[name]>=n?'active':''}" data-value="${n}">★</div>`).join('')}
      </div>
    `;
    container.appendChild(div);
  });
  container.querySelectorAll('.star').forEach(star=>{
    star.addEventListener('click', (e)=>{
      const crit = e.target.closest('.stars').dataset.criterion;
      const val = parseInt(e.target.dataset.value);
      ratings[crit] = val;
      renderCriteria();
    });
  });
}
renderCriteria();

function loadReviews(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch{return []}
}
function saveReviewLocal(review){
  const arr = loadReviews();
  arr.unshift(review);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  renderSaved();
}
function renderSaved(){
  const box = document.getElementById('reviewsBox');
  const list = document.getElementById('reviewsList');
  const arr = loadReviews();
  if(!arr.length){box.style.display='none';return;}
  box.style.display='block';
  list.innerHTML = arr.slice(0,5).map(r=>`
    <div class="review-item">
      <div class="review-head">${r.name} - ${new Date(r.date).toLocaleDateString('ar-SA')}</div>
      <div style="font-size:13px;opacity:.9">${CRITERIA.map(c=>`${c}: ${r.ratings[c]||0}★`).join(' | ')}</div>
      ${r.comment ? `<div style="margin-top:6px;font-size:13px">"${r.comment}"</div>` : ''}
    </div>
  `).join('');
}
renderSaved();

document.getElementById('submitBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const comment = document.getElementById('custComment').value.trim();
  const status = document.getElementById('statusMsg');

  if(!name){status.textContent='الرجاء إدخال الاسم'; status.style.color='#ffb3b3'; return;}
  const missing = CRITERIA.filter(c=>!ratings[c]);
  if(missing.length){status.textContent='الرجاء تقييم جميع المعايير: ' + missing.join('، '); status.style.color='#ffb3b3'; return;}

  const avg = (Object.values(ratings).reduce((a,b)=>a+b,0)/CRITERIA.length).toFixed(1);
  const review = {name, phone, ratings:{...ratings}, comment, avg, date:new Date().toISOString()};

  status.textContent='جاري الحفظ...'; status.style.color='var(--gold)';
  
  try{
    saveReviewLocal(review);
    status.textContent = '✓ تم حفظ التقييم بنجاح - شكراً لك!';
    status.style.color = '#8effb1';

    // Google Sheets POST
    fetch(POST_URL, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(review)
    }).catch(()=>{});

    setTimeout(()=>{ status.textContent=''; }, 4000);
  }catch(e){
    status.textContent='حدث خطأ أثناء الحفظ';
    status.style.color='#ffb3b3';
  }
});

document.getElementById('waBtn').addEventListener('click', ()=>{
  const msg = encodeURIComponent('السلام عليكم، أود الاستفسار عن خدمات ديباج للستائر');
  window.open('https://wa.me/' + WHATSAPP_NUMBER + '?text=' + msg, '_blank');
});
</script>
</body>
</html>
