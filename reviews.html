<script>
(function(){
  document.addEventListener('click', function(e){
    var el = e.target;
    var d = 0;
    while(el && el != document && d < 6){
      if((el.textContent||'').trim() === 'الرئيسية'){
        e.preventDefault();
        e.stopImmediatePropagation();
        window.location.href = 'https://dibaj-decor.github.io/';
        return false;
      }
      el = el.parentElement;
      d++;
    }
  }, true);
})();
</script>
</body>
</html>
